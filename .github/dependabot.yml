version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    # Dependency maintenance is handled by the dependency audit workflow.
    schedule:
      interval: yearly
    open-pull-requests-limit: 0
    # Suppress update PRs, including security updates, for this project only.
    # Alert suppression requires the manifest-based rule documented in
    # https://github.com/hydra-ecosystem/github-actions/blob/2b6bf3b11fc287a6b31617623e9b9ba52fe6e1f0/docusaurus/maintenance.md.
    ignore:
      - dependency-name: "*"
