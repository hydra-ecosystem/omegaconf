name: Annual npm dependency audit

on:
  schedule:
    - cron: '0 2 30 1 *'  # January 30, 02:00 UTC
  workflow_dispatch:
    inputs:
      directory:
        description: npm project directory; leave empty to use the configured directory
        type: string

permissions:
  contents: read

concurrency:
  group: annual-npm-audit
  cancel-in-progress: false

env:
  # Change this fallback when copying the workflow to another deployment.
  NPM_PROJECT: ${{ inputs.directory || 'website' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Audit, propose upgrades, and build
        run: python .github/scripts/annual_npm_audit.py --directory "$NPM_PROJECT"
      - uses: actions/upload-artifact@v5
        with:
          name: annual-npm-audit
          if-no-files-found: error
          path: |
            ${{ env.NPM_PROJECT }}/package.json
            ${{ env.NPM_PROJECT }}/package-lock.json
            ${{ env.NPM_PROJECT }}/DEPENDENCY-AUDIT.md

  pull-request:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: annual-npm-audit
          path: ${{ env.NPM_PROJECT }}
      - name: Open or update the umbrella PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: maintenance/annual-npm-audit
          PR_TITLE: 'Annual documentation dependencies: best-effort upgrade drive'
          PR_BODY: |
            Annual best-effort maintenance of the `${{ env.NPM_PROJECT }}` npm project.

            This umbrella PR proposes current stable direct dependencies and compatible
            transitive security fixes. Remaining findings are accepted between annual
            reviews. It does not promise to resolve every advisory or migration.

            See `${{ env.NPM_PROJECT }}/DEPENDENCY-AUDIT.md` for before/after audit counts,
            proposed upgrades, build results, and outstanding manual work.

            Review major-version changes and retained overrides, and approve the normal
            PR validation workflows before merging. Nothing is merged automatically.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          expected_head=$(git rev-parse --verify "refs/remotes/origin/$PR_BRANCH" 2>/dev/null || true)
          git checkout -B "$PR_BRANCH"
          git add -- "$NPM_PROJECT/package.json" "$NPM_PROJECT/package-lock.json" "$NPM_PROJECT/DEPENDENCY-AUDIT.md"
          if git diff --cached --quiet; then
            echo 'No dependency audit changes to publish.'
            exit 0
          fi
          git commit -m 'Annual documentation dependency audit and upgrades'
          git push --force-with-lease="refs/heads/$PR_BRANCH:$expected_head" origin "HEAD:refs/heads/$PR_BRANCH"

          body_file="$RUNNER_TEMP/annual-npm-audit-pr.md"
          printf '%s\n' "$PR_BODY" > "$body_file"
          pr_number=$(gh pr list --state open --head "$PR_BRANCH" --base "$BASE_BRANCH" --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body-file "$body_file"
            if [ "$(gh pr view "$pr_number" --json isDraft --jq .isDraft)" = false ]; then
              gh pr ready "$pr_number" --undo
            fi
          else
            gh pr create --draft --head "$PR_BRANCH" --base "$BASE_BRANCH" --title "$PR_TITLE" --body-file "$body_file"
          fi
