name: Annual npm dependency audit

on:
  schedule:
    - cron: '0 2 30 1 *'  # January 30, 02:00 UTC
  workflow_dispatch:
    inputs:
      directory:
        description: npm project directory; leave empty to use the configured directory
        type: string

permissions:
  contents: read

concurrency:
  group: annual-npm-audit
  cancel-in-progress: false

env:
  # Change this fallback when copying the workflow to another deployment.
  NPM_PROJECT: ${{ inputs.directory || 'website' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Audit, propose upgrades, and build
        run: |
          python .github/scripts/annual_npm_audit.py --directory "$NPM_PROJECT" --report "$RUNNER_TEMP/annual-npm-audit-pr.md"
          cat "$RUNNER_TEMP/annual-npm-audit-pr.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: annual-npm-dependencies
          if-no-files-found: error
          path: |
            ${{ env.NPM_PROJECT }}/package.json
            ${{ env.NPM_PROJECT }}/package-lock.json
      - uses: actions/upload-artifact@v5
        with:
          name: annual-npm-audit-report
          if-no-files-found: error
          path: ${{ runner.temp }}/annual-npm-audit-pr.md

  pull-request:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: annual-npm-dependencies
          path: ${{ env.NPM_PROJECT }}
      - uses: actions/download-artifact@v6
        with:
          name: annual-npm-audit-report
          path: ${{ runner.temp }}
      - name: Open or update the umbrella PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: maintenance/annual-npm-audit
          PR_TITLE: 'Annual documentation dependencies: best-effort upgrade drive'
          PR_FOOTER: |
            Review major-version changes and retained overrides, and approve the normal
            PR validation workflows before merging. Nothing is merged automatically.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          expected_head=$(git rev-parse --verify "refs/remotes/origin/$PR_BRANCH" 2>/dev/null || true)
          body_file="$RUNNER_TEMP/annual-npm-audit-pr.md"
          printf '\n%s\n' "$PR_FOOTER" >> "$body_file"
          pr_number=$(gh pr list --state open --head "$PR_BRANCH" --base "$BASE_BRANCH" --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          git checkout -B "$PR_BRANCH"
          git add -- "$NPM_PROJECT/package.json" "$NPM_PROJECT/package-lock.json"
          if git diff --cached --quiet; then
            if [ -z "$pr_number" ]; then
              echo 'No dependency changes; see the Actions run summary for the audit report.'
              exit 0
            fi
            printf '\nThis run produced no dependency changes relative to `%s`. The existing PR branch was left unchanged; the audit above describes this run.\n' "$BASE_BRANCH" >> "$body_file"
          else
            git commit -m 'Annual documentation dependency audit and upgrades'
            git push --force-with-lease="refs/heads/$PR_BRANCH:$expected_head" origin "HEAD:refs/heads/$PR_BRANCH"
          fi
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body-file "$body_file"
          else
            gh pr create --head "$PR_BRANCH" --base "$BASE_BRANCH" --title "$PR_TITLE" --body-file "$body_file"
          fi
