name: Annual documentation dependency audit

'on':
  schedule:
    - cron: '0 2 30 1 *'  # January 30, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: annual-npm-audit
  cancel-in-progress: false

env:
  # Change this configured project when copying the workflow to another deployment.
  NPM_PROJECT: website

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
      - name: Enable the project's pinned pnpm
        run: corepack enable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Install audit report parser
        run: python -m pip install PyYAML==6.0.3
      - name: Audit, propose upgrades, and build
        run: |
          python .github/scripts/annual_npm_audit.py --directory "$NPM_PROJECT" --report "$RUNNER_TEMP/annual-npm-audit-pr.md"
          cat "$RUNNER_TEMP/annual-npm-audit-pr.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: annual-npm-dependencies
          if-no-files-found: error
          path: |
            ${{ env.NPM_PROJECT }}/package.json
            ${{ env.NPM_PROJECT }}/pnpm-lock.yaml
            ${{ env.NPM_PROJECT }}/pnpm-workspace.yaml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: annual-npm-audit-report
          if-no-files-found: error
          path: ${{ runner.temp }}/annual-npm-audit-pr.md

  pull-request:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Verify audit dependency state
        env:
          AUDIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dependency_paths=(
            "$NPM_PROJECT/package.json"
            "$NPM_PROJECT/pnpm-lock.yaml"
            "$NPM_PROJECT/pnpm-workspace.yaml"
          )
          if ! git cat-file -e "${AUDIT_SHA}^{commit}" 2>/dev/null; then
            echo "Triggering audit revision ${AUDIT_SHA} is not available locally; fetching it."
            if ! git fetch --no-tags origin "$AUDIT_SHA"; then
              echo "::error::Unable to fetch the triggering audit revision; refusing stale publication."
              exit 1
            fi
          fi
          if ! git cat-file -e "${AUDIT_SHA}^{commit}" 2>/dev/null; then
            echo "::error::The triggering audit revision could not be resolved; refusing publication."
            exit 1
          fi
          if git diff --quiet "$AUDIT_SHA" HEAD -- "${dependency_paths[@]}"; then
            :
          else
            comparison_status=$?
            if [ "$comparison_status" -eq 1 ]; then
              echo "::error::The default branch dependency files changed since ${AUDIT_SHA}; rerun the audit from the current default branch."
            else
              echo "::error::Unable to compare default-branch dependency files with ${AUDIT_SHA}; refusing publication."
            fi
            exit 1
          fi
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: annual-npm-dependencies
          path: ${{ env.NPM_PROJECT }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: annual-npm-audit-report
          path: ${{ runner.temp }}
      - name: Open or update the umbrella PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: maintenance/annual-npm-audit
          PR_TITLE: 'Annual documentation dependencies: best-effort upgrade drive'
          PR_FOOTER: |
            Review major-version changes and retained overrides. Select Approve workflows
            to run on this PR before merging. The documentation
            workflow validates both API snapshots and page examples before building.
            Nothing is merged automatically.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          expected_head=$(git rev-parse --verify "refs/remotes/origin/$PR_BRANCH" 2>/dev/null || true)
          body_file="$RUNNER_TEMP/annual-npm-audit-pr.md"
          printf '\n%s\n' "$PR_FOOTER" >> "$body_file"
          pr_number=$(gh pr list --state open --head "$PR_BRANCH" --base "$BASE_BRANCH" --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          git checkout -B "$PR_BRANCH"
          git add -- "$NPM_PROJECT/package.json"
          git add -- "$NPM_PROJECT/pnpm-lock.yaml" "$NPM_PROJECT/pnpm-workspace.yaml"
          if git diff --cached --quiet; then
            if [ -z "$pr_number" ]; then
              echo 'No dependency changes; see the Actions run summary for the audit report.'
              exit 0
            fi
            printf '\nThis run produced no dependency changes relative to `%s`. The existing PR branch was left unchanged; the audit above describes this run.\n' "$BASE_BRANCH" >> "$body_file"
          else
            git commit -m 'Annual documentation dependency audit and upgrades'
            git push --force-with-lease="refs/heads/$PR_BRANCH:$expected_head" origin "HEAD:refs/heads/$PR_BRANCH"
          fi
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body-file "$body_file"
          else
            gh pr create --head "$PR_BRANCH" --base "$BASE_BRANCH" --title "$PR_TITLE" --body-file "$body_file"
          fi
